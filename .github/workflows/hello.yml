name: Boundary

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Who expands what
        env:
          SAFE: ${{ github.ref }}
        run: |
          echo "GitHub substituted: ${{ github.ref }}"
          echo "Shell expanded:     $SAFE"
          echo "Shell, not GitHub:  $GITHUB_REF"