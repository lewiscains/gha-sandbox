name: What can this token do

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    probe:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Try to read the repo
              run: gh repo view "$GH_REPO" --json name

            - name: Try to create an issue
              continue-on-error: true
              run: gh issue create --title "token probe" --body "delete me"
