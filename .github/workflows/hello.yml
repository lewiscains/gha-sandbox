name: What do I see2

on:
    push:
        branches: [main]
        tags: ["v*"]
        paths: ['src/**']
    pull_request:
    workflow_dispatch:

jobs:
    inspect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Report context
              run: |
                  {
                    echo "| field | value |"
                    echo "|---|---|"
                    echo "| event_name | ${{ github.event_name }} |"
                    echo "| ref | ${{ github.ref }} |"
                    echo "| sha | ${{ github.sha }} |"
                    echo "| head_ref | ${{ github.head_ref }} |"
                  } >> "$GITHUB_STEP_SUMMARY"
            - name: Is this SHA in my branch history?
              run: git log --oneline -1 "${{ github.sha }}" || echo "NOT FOUND in this clone"
