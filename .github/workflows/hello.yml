name: Injectable

on:
    workflow_dispatch:

jobs:
    greet:
        runs-on: ubuntu-latest
        steps:
            - id: vars
              run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            - run: echo "Short SHA is [${{ steps.vars.outputs.short }}]"
            - run: echo "Typo gives [${{ steps.vars.outputs.shrot }}]"
