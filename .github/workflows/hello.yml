name: Hello

on:
    workflow_dispatch:

jobs:
    writer:
        runs-on: ubuntu-latest
        steps:
            - run: echo "a secret message" > /tmp/note.txt
            - run: cat /tmp/note.txt
            - run: exit 1

    reader:
        runs-on: ubuntu-latest
        needs: writer
        steps:
            - run: cat /tmp/note.txt
