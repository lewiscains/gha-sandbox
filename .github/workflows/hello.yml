name: What do I see3

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

jobs:
    inspect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Is this SHA in my branch history?
              run: git log --oneline -1 "${{ github.sha }}" || echo "NOT FOUND in this clone"
            - name: Greet the PR
              run: echo "Building ${{ github.event.pull_request.title }}"
            - name: Greet the PR2
              env:
                TITLE: ${{ github.event.pull_request.title }}
              run: echo "Building $TITLE"
